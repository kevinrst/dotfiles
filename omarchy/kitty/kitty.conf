#Keep this include to stay on Omarchy's theming system (colors come from the
# current Omarchy theme). This is the "styles" part of the old setup, which is
# intentionally NOT ported -- see kitty-syle.conf in config/kitty/.
include ~/.local/state/omarchy/current/theme/kitty.conf

# Settings ported from config/kitty/kitty.conf (old Arch setup).
# Learn more: https://sw.kovidgoyal.net/kitty/conf/

# Shell
shell zsh

# Font
font_size 10
font_family      JetBrainsMono Nerd Font

# Cursor
cursor_shape block
cursor_blink no

window_padding_width 20

confirm_os_window_close 0
